  <script>
    // Register the PWA service worker + auto-update when a new version is
    // available. Network-first SW ensures fresh code online; this block makes
    // sure the SW *itself* updates without manual reinstall.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./service-worker.js");
          // Force an update check on every launch + hourly while the tab is open.
          reg.update().catch(() => {});
          setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
          // When the new SW is finished installing, swap it in immediately.
          reg.addEventListener("updatefound", () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener("statechange", () => {
              if (sw.state === "installed" && navigator.serviceWorker.controller) {
                // New version installed and an old one is still in control.
                // Tell the new SW to skip waiting → controllerchange → reload.
                sw.postMessage({ type: "SKIP_WAITING" });
              }
            });
          });
          // When control transfers to the new SW, reload once to load fresh code.
          let _swReloading = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (_swReloading) return;
            _swReloading = true;
            window.location.reload();
          });
        } catch (e) {
          console.warn("[sw] registration failed:", e);
        }
      });
    }
  </script>
