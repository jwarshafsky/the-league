<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The League">
  <meta name="theme-color" content="#1e40af">
  <title>The League</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/styles.css?v=91">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="back-btn" onclick="goBack()">Back</button>
    <h1 id="header-title"><a href="https://fantasy.espn.com/baseball/league?leagueId=1200" target="_blank" rel="noopener">The League</a></h1>
  </header>

  <nav class="nav-tabs">
    <button class="nav-tab active" data-tab="eligible" onclick="switchTab('eligible')">Select Keepers</button>
    <button class="nav-tab" data-tab="keepers" onclick="switchTab('keepers')">2026 Keepers</button>
    <button class="nav-tab" data-tab="rule5" onclick="switchTab('rule5')">Rule 5 Draft</button>
    <button class="nav-tab" data-tab="draft" onclick="switchTab('draft')">Minors Draft</button>
    <button class="nav-tab" data-tab="rosters" onclick="switchTab('rosters')">Minors Rosters</button>
    <button class="nav-tab" data-tab="trade-block" onclick="switchTab('trade-block')">Trade Block</button>
    <button class="nav-tab" data-tab="trade-inbox" onclick="switchTab('trade-inbox')" id="nav-trade-inbox">Trade Inbox</button>
    <button class="nav-tab" data-tab="trades" onclick="switchTab('trades')">Trade Log</button>
    <button class="nav-tab" data-tab="activity" onclick="switchTab('activity')">Activity</button>
    <button class="nav-tab" data-tab="trophy-room" onclick="switchTab('trophy-room')">League History</button>
    <button class="nav-tab" data-tab="rules" onclick="switchTab('rules')">League Rules</button>
  </nav>

  <main class="main-content" id="main-content">
    <!-- Content rendered by JS -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.74.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js?v=91"></script>
  <script src="js/db.js?v=91"></script>
  <script src="js/data.js?v=91"></script>
  <script src="js/player-stats-snapshot.js?v=91"></script>
  <script src="js/espn-snapshot.js?v=91"></script>
  <script src="js/history-snapshot.js?v=91"></script>
  <script src="js/prospects.js?v=91"></script>
  <script src="js/app.js?v=91"></script>
  <script src="js/rules-bot.js?v=91"></script>
  <script>
    // Register the PWA service worker. Only on https + non-localhost (browsers
    // require a secure context). Failures are logged but never block the app.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((e) =>
          console.warn("[sw] registration failed:", e)
        );
      });
    }
  </script>
</body>
</html>
