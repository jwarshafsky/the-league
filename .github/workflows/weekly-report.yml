name: Weekly Report (Sunday digest)

on:
  schedule:
    # Monday 01:07 UTC = Sunday 9:07pm EDT / 8:07pm EST. Sends each team's
    # 7-day digest filtered by their notification_prefs (frequency=weekly).
    - cron: '7 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet pywebpush cryptography py_vapid

      - name: Send weekly report
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python3 scripts/weekly_report.py
