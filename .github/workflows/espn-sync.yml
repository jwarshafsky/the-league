name: ESPN Sync

on:
  schedule:
    # Every 15 minutes. GitHub Actions schedules are best-effort during peak
    # load; expect occasional 5-10 min delays.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: espn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install push dependencies
        run: pip install --quiet pywebpush cryptography py_vapid

      - name: Pull ESPN snapshot
        id: sync
        continue-on-error: true
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_LEAGUE_ID: '1200'
          ESPN_SEASON: '2026'
        run: |
          set -o pipefail
          bash scripts/sync_espn.sh 2>&1 | tee /tmp/sync_log.txt

      # Status-write steps are non-fatal. The banner / push are nice-to-have;
      # we don't want a Supabase grant blip or a transient PostgREST error to
      # flag the whole workflow red and email Jeff. Failures show up in the
      # job log.
      - name: Record sync status (success)
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/_sync_status.py --success

      - name: Record sync status (failure + push commish)
        if: steps.sync.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python3 scripts/_sync_status.py --failure --error-file /tmp/sync_log.txt

      - name: Commit if changed
        if: steps.sync.outcome == 'success'
        run: |
          if [[ -z "$(git status --porcelain js/espn-snapshot.js)" ]]; then
            echo "No ESPN changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/espn-snapshot.js
          git commit -m "ESPN sync (auto)"
          # If a concurrent run (e.g. a manual dispatch racing a scheduled run)
          # pushed first, rebasing conflicts on the single-line generated
          # snapshot. Both snapshots are equally fresh, so keep ours (-X theirs
          # = our replayed commits win) to auto-resolve instead of failing red.
          git push || (git pull --rebase -X theirs && git push)

      - name: Fail job if sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1
