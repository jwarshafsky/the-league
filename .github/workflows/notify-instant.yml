name: Notify Instant (trade fan-out)

on:
  schedule:
    # GitHub Actions minimum is 5 min. pg_cron will trigger this every minute
    # via workflow_dispatch for finer granularity; this is the fallback.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-instant
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet "pywebpush<2" cryptography py_vapid   # pywebpush 2.x rejects the Vapid01 instance _push.py passes

      - name: Run instant notifier
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python3 scripts/notify_instant.py
